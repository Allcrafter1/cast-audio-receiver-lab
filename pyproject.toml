[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-audio-receiver-lab"
version = "0.6.0.dev18"
description = "An experimental, audio-only Google Cast V2 receiver"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14,<4",
    "websockets>=14,<18",
    "zeroconf>=0.150,<1",
]

[project.optional-dependencies]
youtube = ["yt-dlp[default]>=2026.8.19", "yt-dlp-ejs>=0.8"]
legacy-research = ["cryptography>=41", "yt-dlp"]
dlna = ["async-upnp-client==0.48.1"]
sonos = ["soco==0.31.2"]

[project.scripts]
cast-audio-lab = "cast_audio_lab.runtime:main"
cast-airplay-discover = "cast_audio_lab.airplay_discovery:main"
cast-vibecast-player = "cast_audio_lab.vibecast_player:main"
cast-speaker-manager = "cast_audio_lab.management:main"
cast-audio-receiver = "cast_audio_lab.runtime:main"
cast-audio-container = "cast_audio_lab.container_entrypoint:main"
cast-audio-bootstrap = "cast_audio_lab.container_bootstrap:main"
cast-audio-bundle = "cast_audio_lab.bundle_artifact:main"

[tool.setuptools.package-data]
cast_audio_lab = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
