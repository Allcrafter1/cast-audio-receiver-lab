name: Cast Audio Receiver Lab
version: "0.6.0-dev17"
slug: cast_audio_receiver
description: Experimental audio-only Cast receiver with modular outputs
url: https://github.com/Allcrafter1/cast-audio-receiver-lab
arch:
  - amd64
startup: services
boot: auto
stage: experimental
init: false
host_network: true
audio: true
hassio_api: true
ingress: true
ingress_port: 0
panel_icon: mdi:speaker-wireless
panel_title: Cast Audio Receiver
options:
  web_port: 8788
  log_level: INFO
  artwork_public_url: ""
  certificate_path: /share/cast-audio-receiver/certs.json
schema:
  web_port: port
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  artwork_public_url: str?
  certificate_path: str
map:
  - type: share
    read_only: true
image: ghcr.io/allcrafter1/cast-audio-receiver
