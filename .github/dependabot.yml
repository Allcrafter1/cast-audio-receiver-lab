version: 2
updates:
  # Python runtime locks are curated together with exact wheel and source
  # inventories. A requirements-only Dependabot PR is necessarily incomplete
  # and is rejected by the release-record tests, so these updates follow the
  # curated procedure in docs/maintenance.md instead.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
