name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[youtube,legacy-research,dlna,sonos]'
      - run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Check reachable publication history
        if: matrix.python == '3.12'
        run: python tools/check_public_history.py .
      - name: Test the isolated publication export
        if: matrix.python == '3.12'
        run: |
          python tools/create_public_source_export.py "$RUNNER_TEMP/public-source"
          cd "$RUNNER_TEMP/public-source"
          PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Build and inspect runtime wheel
        if: matrix.python == '3.12'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python tools/check_release_wheel.py dist/cast_audio_receiver_lab-*.whl

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Reconstruct maintained Vibecast source
        run: |
          git clone https://github.com/Allcrafter1/vibecast.git /tmp/vibecast
          git -C /tmp/vibecast checkout --detach e67628fa72550095f92197550d60d8e94c503d4e
      - name: Test changed frontend crates
        working-directory: /tmp/vibecast
        run: >-
          cargo test --locked
          -p vibecast-apps-default-media
          -p vibecast-apps-youtube
          -p vibecast-bridge
          -p vibecast-platform
          -p vibecast-core
          -p vibecast-player-api
          -p vibecast-sdk
          --lib
      - name: Verify formatting of maintained files
        working-directory: /tmp/vibecast
        run: cargo fmt --all -- --check

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          tags: cast-audio-receiver:ci
