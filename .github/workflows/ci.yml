name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[youtube,legacy-research,dlna,sonos]'
      - run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Check reachable publication history
        if: matrix.python == '3.12'
        run: python tools/check_public_history.py .
      - name: Test the isolated publication export
        if: matrix.python == '3.12'
        run: |
          python tools/create_public_source_export.py "$RUNNER_TEMP/public-source"
          cd "$RUNNER_TEMP/public-source"
          PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Build and inspect runtime wheel
        if: matrix.python == '3.12'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python tools/check_release_wheel.py dist/cast_audio_receiver_lab-*.whl

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Reconstruct maintained Vibecast source
        run: |
          git clone https://github.com/Allcrafter1/vibecast.git /tmp/vibecast
          git -C /tmp/vibecast checkout --detach 6f01a42c8932c798a1ba321102dec8dcbdd8d1e9
      - name: Test changed frontend crates
        working-directory: /tmp/vibecast
        run: >-
          cargo test --locked
          -p vibecast-apps-default-media
          -p vibecast-apps-youtube
          -p vibecast-bridge
          -p vibecast-platform
          -p vibecast-core
          -p vibecast-player-api
          -p vibecast-sdk
          --lib
      - name: Verify formatting of maintained files
        working-directory: /tmp/vibecast
        run: cargo fmt --all -- --check

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            ha_arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BUILD_ARCH=${{ matrix.ha_arch }}
          push: false
          load: true
          tags: cast-audio-receiver:ci
          cache-from: |
            type=gha,scope=ci-${{ matrix.arch }}
            type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,scope=ci-${{ matrix.arch }},mode=max,timeout=2m,ignore-error=true
      - name: Check native runtime without private state or network
        run: |
          docker run --rm --network none --entrypoint /bin/sh cast-audio-receiver:ci -ec '
            vibecast --help >/dev/null
            cliairplay --check
            deno --version
            python -c "import platform, aiohttp, lxml, zeroconf, async_upnp_client, soco; print(platform.machine())"
          '

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Prepare isolated browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-package-lock --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test German and English on desktop, mobile and ingress paths
        run: NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules" node tests/browser_ui.cjs
