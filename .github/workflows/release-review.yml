name: Release artifact review

# Explicit build-artifact run; never pushes an image, creates a public release,
# downloads a Cast bundle or changes repository visibility.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            ha_arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 tools/check_public_history.py .
      - uses: docker/setup-buildx-action@v4
      - name: Build review image with dependency and provenance attestations
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BUILD_ARCH=${{ matrix.ha_arch }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/cast-audio-review.oci.tar
          sbom: true
          provenance: mode=max
          tags: cast-audio-receiver:review
          cache-from: |
            type=gha,scope=ci-${{ matrix.arch }}
            type=gha,scope=publish-${{ matrix.arch }}
      - name: Record artifact integrity
        working-directory: ${{ runner.temp }}
        run: sha256sum cast-audio-review.oci.tar > cast-audio-review.oci.tar.sha256
      - name: Verify OCI blobs, SBOM and provenance
        run: python3 tools/inspect_oci_review.py "${{ runner.temp }}/cast-audio-review.oci.tar" --summary --verify-blobs
      - uses: actions/upload-artifact@v7
        with:
          name: cast-audio-review-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cast-audio-review.oci.tar
            ${{ runner.temp }}/cast-audio-review.oci.tar.sha256
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
