name: Publish candidate image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-candidate-image
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 tools/check_public_history.py .
      - name: Select recorded image version
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          match = re.search(r'^version: "([0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+)"$', Path('cast-audio-receiver/config.yaml').read_text(), re.M)
          if not match:
              raise SystemExit('Unsupported release version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + match.group(1) + '\n')
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/allcrafter1/cast-audio-receiver:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Allcrafter1/cast-audio-receiver-lab
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf 'Image: `ghcr.io/allcrafter1/cast-audio-receiver:%s`\n\nDigest: `%s`\n' "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v7
        with:
          name: published-image-digest-${{ github.sha }}
          path: image-digest.txt
          retention-days: 30
